services:
  neo-4j:
    build: ./neo4j
    container_name: mcp_neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
  backend:
    build:
      context: ./          # directory used as build context
      dockerfile: ./backend/Dockerfile
    container_name: mcp_fastapi_backend
    ports:
      - "8000:8000"
    depends_on:
      neo-4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo-4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
  frontend:
    build: ./frontend
    container_name: mcp_flask_frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
      - neo-4j
    environment:
      - MCP_BACKEND_URL=http://backend:8000