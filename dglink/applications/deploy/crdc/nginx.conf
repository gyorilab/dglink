# DGLink CRDC public routing — copy into the host nginx config.
#
# Typical install (Debian/Ubuntu):
#   sudo cp nginx.conf /etc/nginx/sites-available/dglink-crdc
#   sudo ln -s /etc/nginx/sites-available/dglink-crdc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   * docker compose -f compose.crdc.yaml up (ports bound to 127.0.0.1 per compose)
#   * ALB terminates TLS and forwards HTTP to this host on :80
#   * Replace server_name below with your public hostname
#
# Path policy (keep prefix end-to-end):
#   /crdc/, /search/  — forwarded with full path to Flask
#   /crdc/mcp/        — keep prefix (matches NEO4J_MCP_SERVER_PATH)
#   /browser/, /db/   — keep paths (Neo4j Browser HTTP API)

server {
    listen 80;
    server_name a.example.com;

    # ALB terminates TLS; preserve the original scheme for downstream apps.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }

    location = / {
        return 301 /crdc/;
    }

    location = /crdc {
        return 301 /crdc/;
    }

    location = /search {
        return 301 /search/;
    }

    location = /crdc/mcp {
        return 301 /crdc/mcp/;
    }

    location = /browser {
        return 301 /browser/;
    }

    location /crdc/ {
        proxy_pass http://127.0.0.1:5003/crdc/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /search/ {
        proxy_pass http://127.0.0.1:5001/search/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /crdc/mcp/ {
        proxy_pass http://127.0.0.1:8009/crdc/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /browser/ {
        proxy_pass http://127.0.0.1:7484/browser/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /db/ {
        proxy_pass http://127.0.0.1:7484/db/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
