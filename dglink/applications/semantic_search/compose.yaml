services:
  neo-4j:
    build: ./neo4j
    container_name: semantic_search_neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
  semantic_search_backend:
    build:
      context: ./          # directory used as build context
      dockerfile: ./backend/Dockerfile 
    container_name: semantic_search_standalone_fastapi_backend
    ports:
      - "8001:8001"
    volumes:
      - ./neo4j/graph:/app/resources
  semantic_search_frontend:
    build: ./frontend
    container_name: semantic_search_standalone_flask_frontend
    ports:
      - "5001:5001"
    depends_on:
      - semantic_search_backend
      - neo-4j
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
      PORTAL_NAME: ${PORTAL_NAME}