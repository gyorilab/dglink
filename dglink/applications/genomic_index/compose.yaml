services:
  genomic_index_query_backend:
    build:
      context: ./          # directory used as build context
      dockerfile: ./genomic_index_query_backend/Dockerfile
    container_name: genomic-index-query-backend
    ports:
      - "8002:8002"
    volumes:
      - ./mantis_index:/sw/mantis_index
      - ./neo4j/graph:/app/resources
    env_file:
    - path: ./.env
      required: true
  genomic_index_query_frontend:
    build: ./genomic_index_query_frontend
    container_name: genomic-index-query-frontend
    ports:
      - "5002:5002"
    depends_on:
      - genomic_index_query_backend
    environment:
      - GENOMIC_INDEX_QUERY_BACKEND_URL=http://genomic_index_query_backend:8002
  neo-4j:
    build: neo4j
    container_name: genomic-index-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    env_file:
    - path: ./.env
      required: true