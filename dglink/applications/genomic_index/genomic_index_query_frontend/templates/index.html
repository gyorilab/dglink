<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DGLink · Sequence Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dglink.css') }}">
  <style>
    /* Full-bleed layout: use the whole width of the page (matches Overview). */
    .container { max-width: none; width: 100%; margin: 0; padding: 1.5rem 2.5rem 3rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ nav.chat }}">
      <img class="brand-logo" src="{{ url_for('static', filename='dglink-logo.svg') }}" alt="">
      <span class="brand-name">DGLink</span>
    </a>
    <nav class="site-nav">
      <a href="{{ nav.overview }}" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
      {% if show_chat %}<a href="{{ nav.chat }}" class="{{ 'active' if active == 'chat' else '' }}">Chat Assistant</a>{% endif %}
      <a href="{{ nav.query }}" class="{{ 'active' if active == 'query' else '' }}">Query Builder</a>
      {% if show_sequence %}<a href="{{ nav.sequence }}" class="{{ 'active' if active == 'sequence' else '' }}">Sequence Search</a>{% endif %}
      <a href="{{ neo4j_browser_url }}" target="_blank" rel="noopener">Graph Browser ↗</a>
      <a href="https://github.com/gyorilab/dglink" target="_blank" rel="noopener">Project Repository ↗</a>
      <a href="https://gyorilab.github.io/papers/dglink_ismb_2026.pdf" target="_blank" rel="noopener">Project Abstract ↗</a>
    </nav>
  </header>
  <div class="accent-stripe"></div>

  <div class="container">
    <div class="card">
      <div class="eyebrow">Genomic index</div>
      <h1 class="page-title">Genomic index query</h1>
      <p class="subtitle">Paste a FASTA sequence or raw nucleotide string to search the index</p>

      <div class="form-field" style="margin-top: 1.75rem;">
        <label class="label">Sequence input
          <span id="statusPill" class="chip" style="display:none; float:right;"></span>
        </label>
        <textarea id="seqInput" class="field mono" style="min-height: 180px; font-size: .82rem;"
          placeholder=">header|optional&#10;ACGTACGTACGT...&#10;&#10;or paste a raw nucleotide sequence directly"
          spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
      </div>

      <div id="errorBanner" class="error-banner" style="display:none;"></div>

      <div class="field-row">
        <div class="form-field" style="margin-bottom:0;">
          <label class="label">Index</label>
          <select id="indexSelect" class="field mono" style="width: 150px;">
            <option value="mantis">Mantis</option>
            <option value="squeakr">Squeakr</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label class="label">k-mer size</label>
          <input type="number" id="kmerSize" class="field mono" style="width: 110px;" value="31" min="15" max="63" step="2">
        </div>
        <div class="form-field" style="margin-bottom:0;">
          <label class="label">Threshold</label>
          <input type="number" id="threshold" class="field mono" style="width: 110px;" value="0.8" min="0" max="1" step="0.05">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="queryBtn" onclick="runQuery()">Search index</button>
        <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
      </div>
    </div>

    <div id="results" style="display:none;">
      <p class="results-meta" id="resultsHeader"></p>
      <div class="results-grid" id="resultsBody"></div>
    </div>
  </div>

  <script>
    document.getElementById('seqInput').addEventListener('input', function () {
      const pill = document.getElementById('statusPill');
      const val = this.value;
      if (!val.trim()) { pill.style.display = 'none'; return; }
      const stripped = val.replace(/^>.*$/mg, '').replace(/\s/g, '');
      const ok = stripped.length > 0 && /^[ACGTNacgtn]+$/.test(stripped);
      pill.style.display = 'inline-flex';
      pill.className = 'chip ' + (ok ? 'chip-valid' : 'chip-invalid');
      pill.textContent = ok ? 'valid' : 'invalid characters';
    });

    function clearAll() {
      document.getElementById('seqInput').value = '';
      document.getElementById('statusPill').style.display = 'none';
      document.getElementById('errorBanner').style.display = 'none';
      document.getElementById('results').style.display = 'none';
    }

    async function runQuery() {
      const seq = document.getElementById('seqInput').value.trim();
      const k = parseInt(document.getElementById('kmerSize').value);
      const threshold = parseFloat(document.getElementById('threshold').value);
      const index = document.getElementById('indexSelect').value;
      const btn = document.getElementById('queryBtn');
      const errBanner = document.getElementById('errorBanner');

      if (!seq) return;
      errBanner.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Querying…';

      try {
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sequence: seq, k, threshold, index })
        });
        const data = await res.json();
        if (!res.ok) {
          errBanner.textContent = data.error || 'Query failed.';
          errBanner.style.display = 'block';
          document.getElementById('results').style.display = 'none';
        } else {
          renderResults(data);
        }
      } catch (err) {
        errBanner.textContent = 'Network error: ' + err.message;
        errBanner.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Search index';
      }
    }

    function renderResults(data) {
      const { results, meta } = data;
      const section = document.getElementById('results');
      const header = document.getElementById('resultsHeader');
      const body = document.getElementById('resultsBody');

      section.style.display = 'block';
      header.innerHTML = `<strong>${meta.sequence_count} sequence${meta.sequence_count !== 1 ? 's' : ''}</strong>`
        + ` — ${meta.total_kmers.toLocaleString()} k-mers (k=${meta.k}) — threshold ${meta.threshold} — ${meta.index}`;

      body.innerHTML = results.map(r => {
        const best = r.hits[0] ?? null;
        const matched = r.hits.length > 0;

        const hitBadges = r.hits.map(f => `
          <span class="chip chip-match" title="${f.sample_id}: ${f.kmer_hits} k-mer hits">
            ${f.sample_id} — ${(f.hit_fraction * 100).toFixed(1)}%
          </span>`).join('');

        const links = []
          .concat(r.result_url ? `<a class="link" href="${r.result_url}" target="_blank" rel="noopener">View in KG</a>` : [])
          .concat(r.ensemble_url ? `<a class="link" href="${r.ensemble_url}" target="_blank" rel="noopener">View in Ensembl</a>` : [])
          .join('');

        return `
          <div class="result-card">
            <div class="result-eyebrow">${r.query?.header || 'raw sequence'}</div>
            <div class="result-gene">${r.gene_symbol || r.id}</div>
            ${links ? `<div class="result-links">${links}</div>` : ''}
            <div class="chips">
              <span class="chip ${matched ? 'chip-hit' : 'chip-muted'}">
                ${r.hits.length} sample${r.hits.length !== 1 ? 's' : ''} matched
              </span>
              <span class="chip">${r.num_kmers.toLocaleString()} k-mers</span>
              <span class="chip">${r.query?.length?.toLocaleString() ?? '—'} bp</span>
              ${r.biotype ? `<span class="chip">${r.biotype}</span>` : ''}
            </div>
            ${best ? `<div class="chips"><span class="chip chip-match">best: ${best.sample_id} (${(best.hit_fraction * 100).toFixed(1)}%)</span></div>` : ''}
            ${hitBadges ? `<div class="chips">${hitBadges}</div>` : ''}
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
